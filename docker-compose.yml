name: advisu

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-advisu}
      CHROMA_PERSIST_DIR: /app/chroma_store
      DEGREE_DATA_DIR: /app/data
      CATALOG_DATA_DIR: /app/data
      SOURCES_DIR: /app/sources
      PORT: "8000"
      AUTO_BUILD_VECTOR_INDEX: ${AUTO_BUILD_VECTOR_INDEX:-true}
      AUTO_SEED_COURSES: "true"
      ADVISU_LAB_DENSE: ${ADVISU_LAB_DENSE:-true}
      STUDENT_USERNAME: ${STUDENT_USERNAME:-student}
      STUDENT_PASSWORD: ${STUDENT_PASSWORD:-student}
    volumes:
      - chroma_data:/app/chroma_store
      - uploads_data:/app/uploaded_documents
      - huggingface_cache:/app/.cache/huggingface
      - ./sources:/app/sources:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/test', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  mongo_data:
  chroma_data:
  uploads_data:
  huggingface_cache:
